{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "app.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.certIssuer }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "app.name" . }}-api
                port:
                  number: {{ .Values.api.port }}
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: {{ include "app.name" . }}-api
                port:
                  number: {{ .Values.api.port }}
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: {{ include "app.name" . }}-api
                port:
                  number: {{ .Values.api.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "app.name" . }}-web
                port:
                  number: 80
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ include "app.name" . }}-tls
  {{- end }}
{{- end }}
